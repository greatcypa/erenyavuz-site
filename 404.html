<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Eren Yavuz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6C48 6 58 18 58 34S48 60 32 60 6 50 6 34 16 6 32 6Z' fill='%23fff' stroke='%230E9F8E' stroke-width='4'/%3E%3Ccircle cx='23' cy='29' r='7' fill='%23fff' stroke='%230E9F8E' stroke-width='3'/%3E%3Ccircle cx='42' cy='28' r='5.5' fill='%23fff' stroke='%230E9F8E' stroke-width='3'/%3E%3Ccircle cx='24' cy='30' r='3' fill='%230E9F8E'/%3E%3Ccircle cx='43' cy='29' r='2.4' fill='%230E9F8E'/%3E%3Cpath d='M20 41Q32 46 44 40Q38 54 20 41Z' fill='%23fff' stroke='%230E9F8E' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#000000;--monster:#0E9F8E;--monster-deep:#08766A;--fog:#6B7270;--pad:clamp(20px,4vw,56px)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:var(--s,48px) var(--pad);
  background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:48px}
h1{margin:0;font-size:clamp(44px,7vw,112px);font-weight:600;letter-spacing:-.035em;line-height:.95;max-width:12ch}
p{margin:24px 0 0;font-size:clamp(20px,2vw,26px);line-height:1.3;max-width:34ch}
.en{color:var(--fog);font-size:18px;margin-top:8px}
a{display:inline-block;margin-top:40px;font-size:20px;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--monster);text-decoration-thickness:2px;text-underline-offset:6px}
a:hover{color:var(--monster-deep)}
a:focus-visible{outline:3px solid var(--monster);outline-offset:4px;border-radius:4px}
svg{width:clamp(180px,26vw,340px);height:auto;overflow:visible}
.ln{fill:var(--paper);stroke:var(--monster);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.65,0,.25,1) forwards}
.open{fill:none}
.fl{fill:var(--monster);opacity:0;animation:fade .4s ease .8s forwards}
.q{animation:draw 1s cubic-bezier(.65,0,.25,1) .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media (max-width:720px){.wrap{grid-template-columns:1fr}svg{order:-1;width:180px}}
@media (prefers-reduced-motion:reduce){.ln,.q{animation:none;stroke-dashoffset:0}.fl{animation:none;opacity:1}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence id="noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/>
    <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="wrap">
  <div>
    <h1>Bu sayfa kaçmış.</h1>
    <p>Aradığın sayfa yok ya da yeri değişmiş.</p>
    <p class="en">This page wandered off.</p>
    <a href="/">Ana sayfaya dön</a>
  </div>
  <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <g filter="url(#boil)">
      <path class="ln" pathLength="1" d="M98 32C146 30 180 64 178 114C176 162 146 194 100 192C52 190 22 160 24 110C26 62 52 34 98 32Z"/>
      <circle class="fl" cx="46" cy="128" r="3"/><circle class="fl" cx="62" cy="58" r="2.4"/><circle class="fl" cx="150" cy="150" r="3.2"/><circle class="fl" cx="160" cy="80" r="2.2"/>
      <circle class="ln" pathLength="1" cx="74" cy="100" r="17"/>
      <circle class="ln" pathLength="1" cx="128" cy="96" r="13"/>
      <circle class="fl" cx="68" cy="94" r="7"/>
      <circle class="fl" cx="133" cy="101" r="5.5"/>
      <path class="ln open" pathLength="1" d="M70 148q7-8 14 0t14 0 14 0 14 0"/>
      <path class="ln open q" pathLength="1" d="M150 22q0-13 13-13t13 13c0 9-13 11-13 21"/>
      <circle class="fl" cx="163" cy="54" r="3"/>
    </g>
  </svg>
</main>
<script>
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const n = document.getElementById("noise"); let k = 0;
  setInterval(() => { if (!document.hidden) n.setAttribute("seed", String(1 + (k++ % 3))); }, 125);
})();
</script>
</body>
</html>
